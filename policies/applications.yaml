# Applications Agent submission policy.
version: 1
# Auto-submit only when a rule matches AND the opportunity is verified, you are
# eligible, nothing is missing and every answer comes from your verified profile.
auto_submit_rules:
  # One tap: an opportunity you confirmed yourself (/confirm or the Prepare button)
  # is sent as soon as its application is complete. Email/API only; web forms
  # always come back to you. Global dry-run still blocks real sends.
  - name: approved-by-me
    require_owner_confirmed: true
    submission_methods: [email, api]
max_auto_submits_per_day: 5
# Example rule (disabled):
# - name: devfolio-hackathons
#   opportunity_types: [hackathon]
#   submission_methods: [api]
#   max_effort: low
#   domains: [devfolio.co]
allowed_submission_methods: [api, email]   # never browser automation through CAPTCHA
forbidden_requirements:                    # presence forces approval
  - payment
  - legal_declaration
  - sensitive_disclosure
  - unusual_commitment
