# Global authorization policy. Read-only to bots: loaded by the policy engine at
# process start; there is no code path that lets a bot write this directory.
version: 1

# Actions that have real external side effects. Anything not listed is denied.
actions:
  telegram.notify_owner:   {side_effect: true, description: "Message the owner on Telegram"}
  ntfy.notify_owner:       {side_effect: true, description: "Push a notification headline to the owner's ntfy topic (off until NTFY_TOPIC is set)"}
  email.send:              {side_effect: true, description: "Send an email from an authorized account"}
  email.draft:             {side_effect: true, description: "Create a draft in the mailbox (not sent)"}
  calendar.create_event:   {side_effect: true, description: "Create an event on the owner's calendar"}
  calendar.send_invite:    {side_effect: true, description: "Send calendar invitations to others"}
  social.publish:          {side_effect: true, description: "Publish to LinkedIn / Instagram"}
  application.submit:      {side_effect: true, description: "Submit an application to an external site"}
  outreach.send:           {side_effect: true, description: "Send a cold / follow-up email"}
  vault.write:             {side_effect: true, description: "Write a note into the NOESIS vault"}
  web.fetch:               {side_effect: false, description: "Fetch a public page / feed (read-only)"}
  telegram.custom_agent_reply: {side_effect: true, description: "A custom agent replies to the owner in its own Telegram bot chat"}
  phone.call_owner:        {side_effect: true, description: "Phone the owner with a spoken alert (policies/phone.yaml; off by default)"}
  calendar.owner_event:    {side_effect: true, description: "Put a deadline / OA / interview on the owner's own calendar, no guests (policies/calendar.yaml; off by default)"}

# Owner notifications still go out in dry-run so you can watch the system work.
# Remove an entry to make dry-run silence it as well.
dry_run_exempt:
  - telegram.notify_owner
  - telegram.custom_agent_reply
  - phone.call_owner          # only ever the owner's own number, and off until policies/phone.yaml enables it
  - ntfy.notify_owner
  - vault.write

# The emergency pause stops every other side effect, but you still need to hear
# about approvals and failures while paused.
pause_exempt:
  - telegram.notify_owner
  - telegram.custom_agent_reply
  - ntfy.notify_owner

# Actions where sending twice is harmful. If a previous attempt started but its
# outcome was never recorded (crash or timeout mid-call), it is marked
# 'unknown' and you are asked to check, instead of being sent again.
no_blind_retry:
  - email.send
  - outreach.send
  - social.publish
  - application.submit
  - calendar.send_invite
  - phone.call_owner

# Any action whose attributes.flags contain one of these always needs a human.
always_require_approval:
  - payment
  - purchase
  - legal_declaration
  - sensitive_disclosure
  - irreversible_commitment
  - unusual_commitment
  - unverified_facts
  - template_draft          # a post the writer model didn't write (fallback template): never auto-published
