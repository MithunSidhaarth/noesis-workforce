id: knowledge
name: NOESIS Knowledge Agent
purpose: Ingests learning material into NOESIS as structured Obsidian notes, preserves your notes and serves relevant knowledge to other bots.
agent: knowledge
instructions_file: knowledge.md
tools: [web.fetch, vault.write]
can_message: [orchestrator, content_strategist, outreach, applications, quality]
knowledge_access: [read, write]
model: {default_capability: summarize, allowed_tiers: [none, cheap], daily_call_limit: 40, daily_budget_usd: 0.05}
schedules:
  - {name: daily_ideas, kind: idea_scout, at: "07:30"}
