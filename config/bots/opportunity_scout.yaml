id: opportunity_scout
name: Opportunity Scout
purpose: Continuously discovers internships, fellowships, hackathons, scholarships, competitions, events and grants.
agent: opportunity_scout
instructions_file: opportunity_scout.md
tools: [web.fetch, telegram.notify_owner, vault.write]
can_message: [quality, applications, orchestrator, knowledge]
publish_topics: [opportunity.verified]
model: {default_capability: extract, allowed_tiers: [none, cheap], daily_call_limit: 200, daily_budget_usd: 0.10}
schedules:
  - {name: source_sweep, kind: sweep_sources, every: 15m}
  - {name: deadline_digest, kind: deadline_digest, at: "08:30"}
max_concurrency: 4
task_timeout_s: 600
settings:
  notify_min_score: 0.7
  max_items_per_source: 50
