# Your accounts (see brands.example.yaml for every option).
# Each piece of work you log (/work on Telegram, or the Monday plan) becomes one
# post per brand per channel below, written in that brand's voice.
# Channel ids: connect the account on zernio.com (free for 2 accounts) and copy its
# account id into zernio_account (scripts/zernio_accounts.py lists them). API keys go in .env, never here.
brands:
  - id: msthinks
    name: msthinks
    handle: "@msthinks"
    about: "Mithun's personal brand on Instagram: an AI/ML student at BMSCE building AI and full-stack products, and Cue, a Windows notch app"
    audience: "students and young builders curious about AI and tech"
    voice: "short, visual, one idea per reel; hook under 8 words; curious and plain-spoken"
    link: "https://mithunsidhaarth.in"
    topics: []
    channels:
      instagram: {zernio_account: "", postiz_integration: ""}
  - id: mithunsidhaarth
    name: Mithun Sidhaarth
    handle: "linkedin.com/in/mithunsidhaarth"
    about: "Mithun's professional profile: AI/ML engineering student at BMSCE shipping AI and full-stack products (NIRVAH, EDEN, NEURASPACE, Cue)"
    audience: "recruiters, engineers and fellow students"
    voice: "first-person build log: what I built, the problem, what worked, one lesson; calm, specific, no hype"
    link: "https://mithunsidhaarth.in"
    topics: []
    channels:
      linkedin: {zernio_account: "", postiz_integration: ""}
  # cue.notch (Instagram, for Cue at cue.mithunsidhaarth.in) can come back as a third
  # brand when you connect it; Zernio's free plan covers two accounts.
