# Your accounts (see brands.example.yaml for every option).
# Each piece of work you log (/work on Telegram, or the Monday plan) becomes one
# post per brand per channel below, written in that brand's voice.
# Channel ids: connect the account on zernio.com (free for 2 accounts) and copy its
# account id into zernio_account (scripts/zernio_accounts.py lists them). API keys go in .env, never here.
# Posting stays off until publishing is enabled in policies/publishing.yaml and dry-run is turned off.
brands:
  - id: msthinks
    name: msthinks
    handle: "@msthinks"
    about: "A personal space for ideas, thoughts, and creative explorations at the intersection of technology and philosophy. Run by Mithun, an AI/ML student at BMSCE who builds AI and full-stack products."
    audience: "students and young builders who like thinking about technology, not just using it"
    voice: "short, visual, one idea per reel; hook under 8 words; curious, reflective and plain-spoken; asks a real question"
    link: "https://mithunsidhaarth.in"
    topics: []
    channels:
      instagram: {zernio_account: "6ad22f69280aa6cf7d25355e", postiz_integration: ""}
  - id: mithunsidhaarth
    name: Mithun Sidhaarth
    handle: "linkedin.com/in/mithunsidhaarth"
    about: "Mithun's professional profile: AI/ML engineering student at BMSCE shipping AI and full-stack products (NIRVAH, EDEN, NEURASPACE, Cue)"
    audience: "recruiters, engineers and fellow students"
    voice: "first-person build log: what I built, the problem, what worked, one lesson; calm, specific, no hype"
    link: "https://mithunsidhaarth.in"
    topics: []
    channels:
      linkedin: {zernio_account: "6ad22f8c280aa6cf7d2535eb", postiz_integration: ""}
  # Cue posts go out on @msthinks with cue.notch invited as a collaborator, so they
  # show on both profiles. Work that mentions Cue routes here for Instagram and
  # still goes to your LinkedIn.
  - id: cue
    name: Cue
    handle: "@cue.notch (collab on @msthinks)"
    about: "Cue: a smart, context-aware productivity tool that turns your Windows notch area into a seamless, interactive workspace. Agent approvals, live builds, music, focus and file drop, with Tock the mascot. Site: cue.mithunsidhaarth.in (no public release yet; never say it is out or free)"
    audience: "Windows users, developers who run AI coding agents, productivity nerds"
    voice: "show the feature in the first second; one feature per reel; playful but precise; Tock can wink"
    link: "https://cue.mithunsidhaarth.in"
    topics: ["cue", "cue.notch", "tock", "notch"]
    reels: {every_hours: 3, window: "09:00-23:00", keep_queued: 2}   # NOESIS makes new reels when fewer than 2 are waiting
    channels:
      instagram: {zernio_account: "6ad22f69280aa6cf7d25355e", postiz_integration: "", collaborators: ["cue.notch"]}
