# Your accounts. Copy to config/brands.yaml and fill in.
# Each piece of work you log (/work on Telegram) becomes one post per brand per
# platform: Instagram gets a reel with a hook, short caption and a few hashtags;
# LinkedIn gets a longer first-person story post.
#
# Connect each account on zernio.com (free for the first 2 accounts) and copy its
# account id into zernio_account, or use Postiz (postiz_integration) instead.
# Put ZERNIO_API_KEY / POSTIZ_API_KEY in .env, never here. Then add "zernio:<id>"
# (or "postiz:<id>") for each channel
# to accounts_allowlist in policies/publishing.yaml and set enabled: true.
brands:
  - id: cuenotch
    name: cue.notch
    handle: "@cue.notch"
    about: ""          # one line: what the brand is about
    audience: ""       # who it is for
    voice: ""          # e.g. "technical build-log, calm, no hype"
    link: ""           # optional: Instagram posts say "link in bio", LinkedIn posts include it
    topics: []         # optional keywords; work mentioning them goes to this brand (empty = every piece of work)
    channels:
      instagram: {zernio_account: "", postiz_integration: ""}
      linkedin: {zernio_account: "", postiz_integration: ""}
  - id: msthinks
    name: msthinks
    handle: "@msthinks"
    about: ""
    audience: ""
    voice: ""
    topics: []
    channels:
      instagram: {zernio_account: "", postiz_integration: ""}
      linkedin: {zernio_account: "", postiz_integration: ""}
