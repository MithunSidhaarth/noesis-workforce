# Starter scripts for Cue reels (shots format, see integrations/video/cue_reel.py).
# NOESIS uses one only if no reel with the same hook was made before; after these
# it writes new ones with the model. Claims must match the Cue README: there is no
# public release yet, so never say "download", "free" or "out now".
# Hook rules: first 1.5 s, a pattern break or a bold claim, under 7 words.
scripts:
  - id: babysit
    hook: STOP BABYSITTING YOUR AI AGENT
    shots:
      - {say: "[fast] Stop alt-tabbing to babysit your AI agent.", clip: tool}
      - {say: "Claude Code wants to run a command? It shows up right in your notch.", clip: agent}
      - {say: "[excited] Hit Enter. It runs.", clip: agent, from: 2.0}
      - {say: "Works with Claude Code, Codex, Copilot and Gemini CLI.", clip: tock-agent-needs-you}
      - {say: "[confident] Cue. The notch Windows never had.", clip: tock-task-done}
    cta: LINK IN BIO
    caption: |
      Stop alt-tabbing to babysit your AI agent.
      Cue puts every permission request at the top of your screen: Enter to allow, Esc to deny.
      Building it in public. Link in bio.
      #claudecode #windows #devtools #buildinpublic #ai
  - id: built-a-notch
    hook: WINDOWS HAS NO NOTCH. SO I BUILT ONE
    shots:
      - {say: "[intrigued] Windows never had a notch. So I built one.", clip: hover}
      - {say: "Hover it, and it opens into your whole desk.", clip: home}
      - {say: "Music, agents, focus timer, to-dos, all in one place.", clip: home, from: 3.0}
      - {say: "[playful] And there's a tiny creature living inside it.", clip: tock-music}
      - {say: "This is Cue.", clip: tock-task-done}
    cta: LINK IN BIO
    caption: |
      MacBooks got a notch. Windows got nothing. So I built Cue.
      Hover the top of your screen and it opens into music, agents, focus and to-dos.
      Link in bio.
      #windows #windows11 #desksetup #buildinpublic #productivity
  - id: meet-tock
    hook: THIS LITTLE GUY LIVES IN MY SCREEN
    shots:
      - {say: "[playful] This little guy lives at the top of my screen.", clip: tock-music}
      - {say: "His name is Tock. He vibes to whatever's playing.", clip: tock-music, from: 1.5}
      - {say: "[gasps] Freaks out when my AI agent needs me.", clip: tock-agent-needs-you}
      - {say: "Celebrates when the build passes.", clip: tock-task-done}
      - {say: "[softly] And falls asleep at night.", clip: tock-night}
    cta: MEET TOCK
    caption: |
      Every notch needs a tenant. Meet Tock.
      He dances to music, panics when an agent needs you, and sleeps at night.
      Link in bio.
      #uidesign #mascot #windows #buildinpublic #indiedev
  - id: rust-error
    hook: MY TERMINAL SCREAMED AT ME
    shots:
      - {say: "[frustrated] My terminal screamed a Rust borrow error at me.", clip: quiet}
      - {say: "So I held Space and just asked.", clip: voice}
      - {say: "Cue reads only the window I'm looking at.", clip: voice, from: 3.2}
      - {say: "[impressed] And explains the fix right in the notch.", clip: voice, from: 5.5}
      - {say: "No tab switching. No copy paste.", clip: tock-talking}
    cta: LINK IN BIO
    caption: |
      "What does this Rust error mean?" without leaving the terminal.
      Hold Space, ask, and the answer lands in the notch. Cue only sends the window you pick.
      Link in bio.
      #rustlang #ai #windows #devtools #coding
  - id: risky-command
    hook: WOULD YOU LET AI RUN THIS?
    shots:
      - {say: "[serious] Would you let an AI run commands on your PC without asking?", clip: tool}
      - {say: "Cue labels every request with its risk.", clip: tool, from: 1.0}
      - {say: "Commands are never auto-approved. Ever.", clip: agent}
      - {say: "Esc to deny. Enter to allow once.", clip: agent, from: 1.0}
      - {say: "Safe by default. That's Cue.", clip: tock-task-done}
    cta: SAFE BY DEFAULT
    caption: |
      An agent running a command should look different from an agent reading a file.
      Cue shows the risk first, and commands always wait for you.
      Link in bio.
      #aisafety #claudecode #devtools #windows #ai
  - id: music
    hook: FIVE MUSIC APPS. ONE NOTCH
    shots:
      - {say: "[fast] Spotify, YouTube, VLC, Apple Music. Five apps, five places.", clip: media}
      - {say: "Cue controls whatever's playing, from the top of your screen.", clip: media, from: 1.0}
      - {say: "Play, pause, skip. Without leaving your window.", clip: home}
      - {say: "[playful] And Tock dances along.", clip: tock-music}
    cta: LINK IN BIO
    caption: |
      Your music controls shouldn't live in five different apps.
      Cue works with anything that reports to Windows' media controls.
      Link in bio.
      #windows #spotify #desksetup #productivity #music
  - id: build-pop
    hook: DID YOUR BUILD JUST FAIL?
    shots:
      - {say: "[urgent] Your build just failed. And you were in another app.", clip: tock-something-failed}
      - {say: "With Cue, the notch stretches out with the result.", clip: done}
      - {say: "Green for pass. Red for fail.", clip: tock-task-done}
      - {say: "It stays there until you look. Nothing gets lost.", clip: tock-listening}
    cta: LINK IN BIO
    caption: |
      Never miss the end of a long build again.
      Cue shows the result at the top of your screen and keeps a dot there until you look.
      Link in bio.
      #devtools #coding #windows #buildinpublic #claudecode
  - id: honest-errors
    hook: MOST APPS LIE WHEN THEY FAIL
    shots:
      - {say: "[serious] Most apps hide what went wrong.", clip: tock-something-failed}
      - {say: "When Cue can't reach the AI, it tells you. Plainly.", clip: error}
      - {say: "Retry, or switch to a local model.", clip: error, from: 1.0}
      - {say: "And nothing goes to another provider without you.", clip: tock-listening}
    cta: HONEST SOFTWARE
    caption: |
      Errors should say what happened and what you can do next.
      In Cue a timeout says so, and nothing is quietly sent to another provider.
      Link in bio.
      #ux #uidesign #ollama #ai #windows
  - id: two-agents
    hook: TWO AI AGENTS. ONE NOTCH
    shots:
      - {say: "[fast] Claude Code on one repo. Codex on another.", clip: agent}
      - {say: "Who's waiting for you? Cue shows it at a glance.", clip: tock-agent-needs-you}
      - {say: "Approve without switching a single window.", clip: agent, from: 2.0}
      - {say: "[confident] Run more agents. Lose less focus.", clip: tock-task-done}
    cta: LINK IN BIO
    caption: |
      Running more than one coding agent? Cue shows every session and which one needs you.
      Link in bio.
      #claudecode #codex #devtools #ai #buildinpublic
  - id: night
    hook: EVEN MY NOTCH GOES TO SLEEP
    shots:
      - {say: "[softly] Even my notch goes to sleep.", clip: tock-night}
      - {say: "Nothing happening? It shrinks to a single dot.", clip: sleep}
      - {say: "Move your mouse up, and it's back in a blink.", clip: hover}
      - {say: "Good UI knows when to get out of the way.", clip: tock-music}
    cta: LINK IN BIO
    caption: |
      Good UI knows when to get out of the way.
      Cue shrinks to one amber dot when nothing is happening.
      Link in bio.
      #uidesign #minimalism #windows #buildinpublic #desksetup
